<title>Gianfranco Casetta CV</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Two layouts from one document.
   Print (base rules): one A4 sheet, name header over a career timeline beside a reference column.
   Screen (@media screen): a scrolling site that scales with the monitor. Full-height hero on the
   live grid, then experience beside a sticky skills panel, revealed as they scroll in, with
   smooth wheel scrolling that settles on section starts. */
:root {
  color-scheme: dark;
  /* Palette: main ground (ink, sheet, raise, line), secondary text (paper, mist), accent */
  --ink: #0e1b2c;        /* page ground, deep ink blue */
  --sheet: #13243a;      /* raised surface */
  --raise: #1a3049;      /* chips */
  --line: #2b4563;       /* rules and borders */
  --paper: #efe8d8;      /* primary text, warm ivory */
  --mist: #a9b9cb;       /* secondary text */
  --accent: #f4ab3c;     /* accent */
  --accent-soft: color-mix(in srgb, var(--accent) 15%, transparent);
  --display: "Bricolage Grotesque", "Trebuchet MS", "Segoe UI", sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
}
/* Alternative palettes, all dark and cool, picked from the bar */
:root[data-palette="violet"] { --ink: #120f22; --sheet: #19152e; --raise: #221d3d; --line: #352d59; --paper: #eeebf7; --mist: #aba4c8; --accent: #6ee7c8; }
:root[data-palette="forest"] { --ink: #0b1714; --sheet: #10201c; --raise: #172b26; --line: #24423a; --paper: #e7efe9; --mist: #9db5ab; --accent: #b8a4ff; }
:root[data-palette="slate"]  { --ink: #0d141c; --sheet: #121c27; --raise: #192634; --line: #283a4e; --paper: #e7edf3; --mist: #9aaec2; --accent: #56c8f0; }
:root[data-palette="petrol"] { --ink: #0a1a1f; --sheet: #0f242a; --raise: #163037; --line: #22464f; --paper: #e9f0ef; --mist: #9cb7b6; --accent: #ff8a73; }
* { box-sizing: border-box; }
body {
  background: var(--ink);
  color: var(--paper);
  font: 400 12.5px/1.45 var(--body);
  padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}
a { color: inherit; text-decoration: none; }
a:hover { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
ul { margin: 0; padding: 0; list-style: none; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; }

/* Screen-only pieces are hidden in the base (print) layout */
.progress, .who, .nav, .cue, .sub, .foot { display: none; }
.hero-in, .sec-head, .groups, .skills-rail { display: contents; }
.match, .swatches { display: none; }

.bar {
  width: 100%; max-width: 210mm; margin: 0 auto 12px;
  display: flex; justify-content: flex-end; align-items: center; gap: 10px;
  font: 500 11px var(--mono); color: var(--mist);
}
.acts { display: flex; align-items: center; gap: 10px; }
.lang { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.lang button { color: var(--mist); background: transparent; border: 0; padding: 6px 12px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--ink); }
.pdf:not([hidden]) { display: inline-block; border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; color: var(--paper); }

.sheet {
  width: 100%; max-width: 210mm; min-height: 297mm; margin: 0 auto;
  background: var(--sheet); border: 1px solid var(--line);
  display: flex; flex-direction: column;
}

/* Header */
.head {
  padding: 22px 40px 14px;
  background-image: radial-gradient(var(--line) 1px, transparent 1px);
  background-size: 18px 18px; background-position: 4px 4px;
  border-bottom: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 14px;
  position: relative; overflow: hidden; flex: none;
}
.head > * { position: relative; }
.head > canvas.grid { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.name { font: 800 50px/0.95 var(--display); letter-spacing: -0.02em; text-wrap: balance; }
.name .w { display: inline-block; overflow: hidden; padding: .08em 0 .12em; margin: -.08em 0 -.12em; vertical-align: top; }
.name .c { display: inline-block; }
.name.live .w { overflow: visible; }
.name.live .c {
  transition: transform .35s cubic-bezier(.2, .8, .2, 1), color .35s;
  transform: translateY(calc(var(--k, 0) * -0.08em));
  color: color-mix(in srgb, var(--accent) calc(var(--k, 0) * 100%), var(--paper));
}
.role { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.role b { font: 700 19px/1.2 var(--display); color: var(--accent); }
.role span { font: 500 12px var(--mono); color: var(--mist); }
.about { max-width: 78ch; font-size: 13px; color: var(--paper); }
.contact { display: flex; flex-wrap: wrap; gap: 6px 22px; font: 400 11.5px var(--mono); color: var(--mist); }
.contact li { display: flex; gap: 7px; align-items: center; }
.contact svg { width: 13px; height: 13px; flex: none; stroke: var(--accent); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.contact a { color: var(--paper); }

/* Body grid */
.cols { flex: 1; display: grid; grid-template-columns: minmax(0, 1.72fr) minmax(0, 1fr); }
.main { padding: 14px 28px 12px 40px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.side { padding: 14px 34px 12px 26px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px; min-width: 0; }
h2 { font: 700 17px/1.2 var(--display); color: var(--accent); padding-bottom: 7px; border-bottom: 1px solid var(--line); }
section { display: flex; flex-direction: column; gap: 12px; }
.cols section { position: relative; } /* keeps exported PDF text in reading order */

/* Timeline */
.jobs { --rail: 1; position: relative; display: flex; flex-direction: column; gap: 12px; margin-left: 4px; }
.jobs::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 1px; background: var(--line);
  transform-origin: top; transform: scaleY(var(--rail));
}
.job { --dot: 1; --d: 9px; position: relative; padding-left: 21px; display: flex; flex-direction: column; gap: 7px; }
.job::before, .job.now::after {
  content: ""; position: absolute; left: calc(var(--d) / -2 + .5px); top: 5px; width: var(--d); height: var(--d); border-radius: 50%;
}
.job::before { background: var(--sheet); border: 1.5px solid var(--mist); transform: scale(var(--dot)); z-index: 1; }
.job.now::before { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.job.now::after { border: 1px solid var(--accent); animation: ping 2.4s ease-out infinite; }
@keyframes ping { 0% { transform: scale(1); opacity: .8; } 70%, 100% { transform: scale(3.2); opacity: 0; } }
.job h3 { font: 700 15px/1.25 var(--display); }
.meta { display: flex; flex-wrap: wrap; gap: 2px 14px; align-items: baseline; }
.meta b { font-weight: 600; font-size: 13px; }
.meta span { font: 400 11px var(--mono); color: var(--mist); }
.tasks { display: flex; flex-direction: column; gap: 4px; }
.tasks li { position: relative; padding-left: 14px; transition: opacity .25s; }
.tasks li::before { content: ""; position: absolute; left: 0; top: 0.72em; width: 6px; height: 1.5px; background: var(--accent); transition: width .25s, left .25s; }
/* Skill tracing: picking a skill lights up the work where it was used */
.sheet.tracing .tasks li { opacity: .3; }
.sheet.tracing .tasks li.hit { opacity: 1; }
.sheet.tracing .tasks li.hit::before { width: 10px; left: -4px; }
.tasks strong { font-weight: 600; color: #fff; }

/* Reference column */
.group { display: flex; flex-direction: column; gap: 6px; }
.group h3 { font: 600 12px var(--body); color: var(--paper); }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tags li { font: 400 10.5px/1.2 var(--mono); color: var(--paper); background: var(--raise); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; transition: border-color .2s, color .2s, background .2s; }
.tags li:hover { border-color: var(--accent); color: var(--accent); }
.tags li[data-k] { cursor: pointer; }
.tags li.on { background: var(--accent); border-color: var(--accent); color: var(--ink); }
.hint { font: 400 10px/1.3 var(--mono); color: var(--mist); margin-top: -4px; }
.skills { gap: 13px; }
.list { display: flex; flex-direction: column; gap: 10px; }
.list b { display: block; font-weight: 600; line-height: 1.3; }
.list span { display: block; font: 400 10.5px var(--mono); color: var(--mist); margin-top: 2px; }
.langs { display: flex; flex-direction: column; gap: 5px; }
.langs li { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.langs b { font-weight: 600; }
.langs span { font: 400 10.5px var(--mono); color: var(--accent); text-align: right; }

/* ---------- Screen: a site that scales with the monitor ---------- */
@media screen {
  html { font-size: clamp(15px, calc(11.7px + .241vw), 20px); scroll-behavior: smooth; }
  :root {
    --gl: max(clamp(16px, 4vw, 4.5rem), env(safe-area-inset-left, 0px));
    --gr: max(clamp(16px, 4vw, 4.5rem), env(safe-area-inset-right, 0px));
    --wrap: 96rem;
  }
  body { font-size: 1rem; line-height: 1.6; padding: 0; }
  .hero-in, .cols, .foot-in {
    width: min(100%, calc(var(--wrap) + var(--gl) + var(--gr))); margin-inline: auto;
    padding-left: var(--gl); padding-right: var(--gr);
  }

  /* Fixed top bar */
  .progress {
    display: block; position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); height: 2px; z-index: 21;
    background: var(--accent); transform-origin: left; transform: scaleX(0);
  }
  .bar {
    position: fixed; inset: 0 0 auto; z-index: 20; max-width: none; margin: 0;
    display: grid; grid-template-columns: 1fr auto 1fr; gap: 1.5rem;
    padding-top: calc(env(safe-area-inset-top, 0px) + .75rem); padding-bottom: .75rem;
    padding-left: var(--gl); padding-right: var(--gr);
    font-size: .8rem; border-bottom: 1px solid transparent;
    transition: background-color .35s, border-color .35s;
  }
  .bar.past { background: color-mix(in srgb, var(--ink) 88%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom-color: var(--line); }
  .who {
    display: block; justify-self: start; font: 700 1.05rem/1 var(--display); color: var(--paper);
    background: none; border: 0; padding: 0; cursor: pointer;
    opacity: 0; transform: translateY(-6px); pointer-events: none; transition: opacity .35s, transform .35s;
  }
  .bar.past .who { opacity: 1; transform: none; pointer-events: auto; }
  .nav { display: flex; gap: .25rem; }
  .nav button { color: var(--mist); background: none; border: 0; padding: .45rem .9rem; border-radius: 99px; cursor: pointer; transition: color .2s, background-color .2s; }
  .nav button:hover { color: var(--paper); }
  .nav button[aria-current="true"] { background: var(--accent); color: var(--ink); }
  .acts { justify-self: end; gap: .6rem; }
  .lang button, .pdf:not([hidden]) { padding: .45rem .85rem; }
  .lang, .pdf:not([hidden]) { border-radius: 99px; }
  .pdf:not([hidden]):hover { border-color: var(--accent); }
  .swatches { display: flex; gap: .35rem; padding: 0 .3rem; }
  .swatches button {
    width: 1.35rem; height: 1.35rem; border-radius: 50%; padding: 0; cursor: pointer;
    border: 2px solid transparent; outline: 1px solid var(--line); outline-offset: 1px;
    background: linear-gradient(135deg, var(--sw-bg) 50%, var(--sw-ac) 50%);
    transition: transform .2s;
  }
  .swatches button:hover { transform: scale(1.12); }
  .swatches button[aria-pressed="true"] { outline: 2px solid var(--accent); }

  /* Lenis smooth scrolling */
  html.lenis, html.lenis body { height: auto; }
  .lenis.lenis-smooth { scroll-behavior: auto !important; }
  .lenis.lenis-stopped { overflow: hidden; }

  /* Sheet becomes the page */
  .sheet { max-width: none; min-height: 0; margin: 0; border: 0; background: transparent; display: block; }

  /* Hero */
  .head {
    min-height: min(100vh, 66rem); min-height: min(100svh, 66rem);
    padding: calc(env(safe-area-inset-top, 0px) + 6rem) 0 6rem;
    justify-content: center; gap: 0; background-color: var(--sheet);
  }
  .hero-in { display: flex; flex-direction: column; gap: 1.7rem; }
  .name { font-size: clamp(3rem, 8.4vw, 10.5rem); line-height: .9; letter-spacing: -.035em; }
  .role { gap: .4rem 1.3rem; }
  .role b { font-size: clamp(1.3rem, 2vw, 2.4rem); }
  .role span { font-size: clamp(.85rem, .9vw, 1.05rem); }
  .about { font-size: clamp(1.05rem, 1.2vw, 1.45rem); line-height: 1.6; max-width: 56ch; }
  .contact { font-size: .9rem; gap: .7rem 2.2rem; }
  .contact svg { width: 1.05rem; height: 1.05rem; }
  .head > .cue {
    display: flex; position: absolute; left: 50%; bottom: 1.8rem; transform: translateX(-50%);
    flex-direction: column; align-items: center; gap: .6rem;
    font: 500 .75rem var(--mono); color: var(--mist); background: none; border: 0; cursor: pointer;
  }
  .cue:hover { color: var(--accent); }
  .cue i { display: block; width: 1px; height: 2.8rem; background: linear-gradient(var(--accent), transparent); transform-origin: top; animation: drip 2.4s ease-in-out infinite; }
  @keyframes drip { 0% { transform: scaleY(0); opacity: 1; } 55% { transform: scaleY(1); opacity: 1; } 100% { transform: scaleY(1); opacity: 0; } }

  /* Experience on the left, skills panel sticky on the right, then a row of three */
  .cols {
    display: grid; grid-template-columns: repeat(12, minmax(0, 1fr));
    gap: clamp(5rem, 9vw, 10rem) clamp(1.5rem, 3vw, 3.5rem);
    padding-block: clamp(5rem, 9vw, 10rem) clamp(5rem, 8vw, 9rem);
  }
  .main, .side { display: contents; }
  section { gap: 1.6rem; scroll-margin-top: 6rem; }
  .sec-head { display: flex; flex-direction: column; gap: .9rem; }
  h2 { font-size: clamp(1.8rem, 2.7vw, 3.3rem); line-height: 1.05; letter-spacing: -.015em; padding: 0; border: 0; text-wrap: balance; }
  .sub, .hint, .match { display: block; margin: 0; font: 400 .85rem/1.5 var(--mono); color: var(--mist); }
  .match { color: var(--accent); min-height: 1.5em; }
  #work { order: 1; grid-column: 1 / span 8; gap: 2.4rem; }
  .skills-rail { display: block; order: 2; grid-column: 9 / -1; align-self: stretch; }
  #skills { position: sticky; top: 5.5rem; gap: 1.6rem; padding: 1.6rem; background: var(--sheet); border: 1px solid var(--line); border-radius: .9rem; }
  #skills h2 { font-size: clamp(1.4rem, 1.9vw, 2.2rem); }
  #certs { order: 3; } #edu { order: 4; } #langs { order: 5; }
  #certs, #edu, #langs { grid-column: span 4; }
  .sheet.tracing .job:not(.has-hit) :is(h3, .meta) { opacity: .35; }
  .job h3, .meta { transition: opacity .25s; }
  #certs h2, #edu h2, #langs h2 { font-size: clamp(1.35rem, 1.7vw, 2rem); padding-bottom: 1rem; border-bottom: 1px solid var(--line); }

  /* Timeline */
  .jobs { gap: clamp(3rem, 4.5vw, 5rem); margin-left: .35rem; }
  .job { --d: .85rem; padding-left: 2.3rem; gap: .9rem; }
  .job::before, .job.now::after { top: .5rem; }
  .job h3 { font-size: clamp(1.35rem, 1.8vw, 2.2rem); line-height: 1.15; }
  .meta { gap: .2rem 1.4rem; }
  .meta b { font-size: 1.05rem; }
  .meta span { font-size: .85rem; }
  .tasks { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 24rem), 1fr)); gap: 1rem 2.8rem; margin-top: .5rem; }
  .tasks li { padding-left: 1.25rem; }
  .tasks li::before { width: .55rem; top: .8em; }
  .sheet.tracing .tasks li.hit::before { width: .9rem; left: -.35rem; }

  /* Skills and the rest */
  .groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 11.5rem), 1fr)); gap: 1.4rem 1.6rem; }
  .group { gap: .6rem; }
  .group h3 { font-size: .95rem; }
  .tags { gap: .4rem; }
  .tags li { font-size: .78rem; padding: .36rem .62rem; border-radius: .4rem; }
  .list { gap: 1.3rem; }
  .list b { font-size: 1.05rem; }
  .list span { font-size: .85rem; margin-top: .3rem; }
  .langs { gap: 0; }
  .langs li { padding-block: .75rem; border-bottom: 1px solid var(--line); }
  .langs li:first-child { padding-top: 0; }
  .langs b { font-size: 1.05rem; }
  .langs span { font-size: .85rem; }

  /* Footer */
  .foot { display: block; background: var(--sheet); border-top: 1px solid var(--line); }
  .foot-in { display: flex; flex-direction: column; gap: 1.4rem; padding-block: clamp(5rem, 9vw, 10rem) 3.5rem; }
  .foot-line { font-size: 1.05rem; color: var(--mist); }
  .foot-mail {
    align-self: flex-start; font: 800 clamp(1.9rem, 5.6vw, 7rem)/1 var(--display); letter-spacing: -.03em;
    color: var(--paper); overflow-wrap: anywhere; transition: color .25s;
  }
  .foot-mail:hover { color: var(--accent); }
  .foot-links { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.2rem; font: 500 .85rem var(--mono); }
  .foot-links a, .foot-links button { border: 1px solid var(--line); border-radius: 99px; padding: .55rem 1.05rem; color: var(--paper); background: none; cursor: pointer; transition: border-color .2s, color .2s; }
  .foot-links a:hover, .foot-links button:hover { border-color: var(--accent); color: var(--accent); }
}

@media screen and (max-width: 960px) {
  .bar { grid-template-columns: 1fr auto; }
  .nav { display: none; }
  .cols { grid-template-columns: minmax(0, 1fr); row-gap: 5rem; }

}

  :root { padding: 0 !important; }

<script>
const T = (en, es) => ({ en, es });
const CV = {
  role: "Infrastructure Specialist",
  focus: T("DevOps and Cloud Engineering on AWS", "DevOps y Cloud Engineering en AWS"),
  about: T(
    "Started in datacenter field support, installing storage and running VMware for clients; today I work on how infrastructure changes ship on AWS. Nearly six years across on-prem and cloud taught me to value what others can rely on: pipelines that document themselves and releases that pass audit without extra work. I do my best work side by side with my teammates, and I stay calm when things get demanding.",
    "Empecé en soporte de campo de datacenter, instalando storage y operando VMware para clientes; hoy trabajo en cómo salen los cambios de infraestructura en AWS. Casi seis años entre on-prem y cloud me enseñaron a valorar lo que otros pueden usar con confianza: pipelines que se documentan solos y releases que pasan auditoría sin trabajo extra. Doy lo mejor codo a codo con mis compañeros y mantengo la calma en los momentos exigentes."
  ),
  hint: T("Pick a skill to see where it was used", "Elegí una skill para ver dónde se usó"),
  place: T("Ciudad Jardín, Buenos Aires, Argentina", "Ciudad Jardín, Buenos Aires, Argentina"),
  cue: T("Scroll", "Deslizá"),
  span: T("2021 – Present", "2021 – Actualidad"),
  h: {
    work: T("Work experience", "Experiencia laboral"),
    skills: T("Skills", "Skills"),
    certs: T("Certifications", "Certificaciones"),
    langs: T("Languages", "Idiomas"),
    edu: T("Education", "Educación")
  },
  nav: [
    ["work", T("Experience", "Experiencia")],
    ["certs", T("Background", "Formación")],
    ["contact", T("Contact", "Contacto")]

/* Smooth wheel scrolling (Lenis) that settles on section starts after the wheel stops. */
let lenis = null, snapping = false, lastInput = "", lastDir = 1, snapTimer = 0;
const barH = () => bar.getBoundingClientRect().height + 16;
const yOf = el => el.getBoundingClientRect().top + window.scrollY;
function scrollToY(y, duration = 1.1) {
  if (lenis) lenis.scrollTo(y, { duration, easing: t => 1 - Math.pow(1 - t, 4) });
  else window.scrollTo({ top: y, behavior: reduced ? "auto" : "smooth" });
}
const go = (id, center) => {
  if (id === "top") return scrollToY(0);
  const el = typeof id === "string" ? document.getElementById(id) : id;
  if (el) scrollToY(Math.max(0, yOf(el) - (center ? innerHeight * .35 : barH())));
};
function snapPoints() {
  const max = document.documentElement.scrollHeight - innerHeight;
  return [0, ...["work", "certs", "contact"].map(id => {
    const el = document.getElementById(id);
    return el ? Math.min(max, Math.max(0, yOf(el) - barH())) : null;
  }).filter(v => v !== null)];
}
function snap() {
  if (!lenis || snapping || lastInput !== "wheel" || innerWidth < 960) return;
  const pts = snapPoints(), y = window.scrollY, work = pts[1];
  let target = null;
  if (y > 2 && y < work - 2) target = lastDir > 0 ? work : 0;      /* the hero behaves like one page */
  else {
    const range = innerHeight * .3;
    const near = pts.filter(p => lastDir > 0 ? p > y && p - y < range : p < y && y - p < range);
    if (near.length) target = lastDir > 0 ? Math.min(...near) : Math.max(...near);
  }
  if (target === null || Math.abs(target - y) < 3) return;
  snapping = true;
  lenis.scrollTo(target, { duration: .9, easing: t => 1 - Math.pow(1 - t, 3), onComplete: () => { snapping = false; } });
}
function setupLenis() {
  if (lenis || !canMove || !window.Lenis) return;
  lenis = new Lenis({ lerp: .09, wheelMultiplier: .9, smoothWheel: true });
  lenis.on("scroll", () => {
    if (window.ScrollTrigger) ScrollTrigger.update();
    if (!snapping) { clearTimeout(snapTimer); snapTimer = setTimeout(snap, 140); }
  });
  gsap.ticker.add(t => lenis.raf(t * 1000));
  gsap.ticker.lagSmoothing(0);
  addEventListener("wheel", e => { lastInput = "wheel"; if (e.deltaY) lastDir = Math.sign(e.deltaY); snapping = false; }, { passive: true });
  ["keydown", "touchstart", "pointerdown"].forEach(ev => addEventListener(ev, () => { lastInput = ev; }, { passive: true }));
}

/* End of the intro: letters start reacting to the pointer. */
function settle() {

let pinned = null;
/* Lights up the tasks a skill shows up in and reports how many sit outside the viewport. */
function trace(tag) {
  sheet.querySelectorAll(".hit, .on, .has-hit").forEach(e => e.classList.remove("hit", "on", "has-hit"));
  const hits = [];
  if (tag) {
    const re = new RegExp(tag.dataset.k, "i");
    sheet.querySelectorAll(".tasks li").forEach(li => {
      if (re.test(li.textContent)) { li.classList.add("hit"); li.closest(".job").classList.add("has-hit"); hits.push(li); }
    });
    tag.classList.add("on");
  }
  sheet.classList.toggle("tracing", hits.length > 0);
  const out = hits.filter(li => { const r = li.getBoundingClientRect(); return r.bottom < barH() || r.top > innerHeight; });
  const m = sheet.querySelector(".match");
  if (m) m.textContent = hits.length ? CV.match[lang](hits.length, out.length) : "";
  return { hits, out };
}
function pick(s) {
  pinned = s && s !== pinned ? s : null;
  const r = trace(pinned);

}

/* Scroll story: progress line, hero drifts away, each section reveals as it arrives. */
function scrollFx() {
  if (!window.ScrollTrigger) return;
  gsap.registerPlugin(ScrollTrigger);
  const once = (trigger, start = "top 85%") => ({ trigger, start, once: true });
  const rise = { autoAlpha: 0, y: 24, duration: .7, ease: "power3.out", clearProps: "opacity,visibility,transform" };

  gsap.to(".progress", { scaleX: 1, ease: "none", scrollTrigger: { start: 0, end: "max", scrub: .3 } });
  gsap.to(".hero-in", { yPercent: -10, autoAlpha: .15, ease: "none", scrollTrigger: { trigger: ".head", start: "top top", end: "bottom top", scrub: true } });
  gsap.to(".cue", { autoAlpha: 0, ease: "none", scrollTrigger: { trigger: ".head", start: "top top", end: "12% top", scrub: true } });
  ScrollTrigger.create({ trigger: ".head", start: "bottom top+=90", end: "max", onToggle: s => bar.classList.toggle("past", s.isActive) });

  sheet.querySelectorAll("section").forEach(sec =>
    gsap.from(sec.querySelectorAll(".sec-head > *"), { ...rise, stagger: .08, scrollTrigger: once(sec) }));

  const jobs = sheet.querySelector(".jobs");
  gsap.fromTo(jobs, { "--rail": 0 }, { "--rail": 1, ease: "none", scrollTrigger: { trigger: jobs, start: "top 70%", end: "bottom 75%", scrub: .6 } });
  gsap.utils.toArray(".job").forEach(job => {
    gsap.timeline({ scrollTrigger: once(job, "top 80%") })
      .from(job, { "--dot": 0, duration: .5, ease: "back.out(3)" })
      .from(job.querySelectorAll("h3, .meta"), { ...rise, x: -24, y: 0, stagger: .08 }, "<")
      .from(job.querySelectorAll(".tasks li"), { ...rise, y: 18, duration: .55, stagger: .07 }, "-=.35");
  });
  gsap.utils.toArray(".group").forEach(g => {
    gsap.timeline({ scrollTrigger: once(g, "top 92%") })
      .from(g.querySelector("h3"), { ...rise, y: 12, duration: .45 })
      .from(g.querySelectorAll(".tags li"), { ...rise, y: 10, scale: .7, duration: .4, ease: "back.out(2.2)", stagger: { each: .035, from: "random" } }, "<+.1");
  });
  ["#certs", "#edu", "#langs"].forEach(id => gsap.from(`${id} li`, { ...rise, y: 18, stagger: .09, scrollTrigger: once(id) }));
  gsap.from(".foot-in > *", { ...rise, y: 30, stagger: .1, scrollTrigger: once(".foot", "top 80%") });

  CV.nav.forEach(([id], i) => ScrollTrigger.create({
    trigger: "#" + id, start: "top 55%", end: i === CV.nav.length - 1 ? "max" : "bottom 55%",
    onEnter: () => setNav(id), onEnterBack: () => setNav(id), onLeaveBack: () => { if (i === 0) setNav(null); }
  }));
  if (document.fonts) document.fonts.ready.then(() => ScrollTrigger.refresh());
}

    `<button type="button" data-p="${id}" aria-pressed="${id === cur}" title="${t(label)}" aria-label="${t(label)}" style="--sw-bg:${bg};--sw-ac:${ac}"></button>`).join("");
  document.querySelectorAll("[data-pdf]").forEach(a => { a.href = `Gianfranco-Casetta-CV-${lang.toUpperCase()}.pdf`; });
  if (!document.querySelector(".bar .pdf").hidden) document.querySelectorAll(".foot .pdf").forEach(a => { a.hidden = false; });
  sheet.querySelector(".head").prepend(gridCanvas);
  if (canMove) fx = gsap.context(() => { if (animate) intro(); scrollFx(); });
}

/* Header grid: dots light up near the pointer, a few packets travel the rows, clicks send a ripple. */
(function liveGrid() {
  const ctx = gridCanvas.getContext("2d");
  const STEP = 18, OFF = 13;
  let w = 0, h = 0, cw = 0, ch = 0, px = -999, py = -999, last = 0;
  const ripples = [];
  gridCanvas.ping = (x, y) => ripples.push({ x, y, t: performance.now() });
  const packets = [0, 1, 2, 3, 4, 5].map(() => ({ x: 0, y: 0, v: 0, wait: Math.random() * 3 }));
  const spawn = p => {
    p.y = OFF + STEP * Math.floor(Math.random() * Math.max(1, Math.floor((h - OFF) / STEP)));
    p.v = (70 + Math.random() * 90) * (Math.random() < .5 ? 1 : -1);
    p.x = p.v > 0 ? -40 : w + 40;
    p.wait = 0;
  };
  function size() {
    const r = gridCanvas.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 2);
    if (!r.width) return;
    w = r.width; h = r.height; cw = gridCanvas.clientWidth; ch = gridCanvas.clientHeight;
    gridCanvas.width = Math.round(w * d); gridCanvas.height = Math.round(h * d);
    ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000 || 0); last = now;
    if (gridCanvas.isConnected && (gridCanvas.clientWidth !== cw || gridCanvas.clientHeight !== ch)) size();
    const r = gridCanvas.getBoundingClientRect();
    if (r.bottom < 0) { requestAnimationFrame(frame); return; } /* off screen: skip drawing */
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = gridColor;
    for (let i = ripples.length - 1; i >= 0; i--) {
      const rp = ripples[i], age = (now - rp.t) / 1000;
      if (age > 1.8) { ripples.splice(i, 1); continue; }
      const rad = age * 520, fade = 1 - age / 1.8;
      for (let x = OFF; x < w; x += STEP) for (let y = OFF; y < h; y += STEP) {
        const d = Math.abs(Math.hypot(x - rp.x, y - rp.y) - rad);
        if (d > 28) continue;
        const k = 1 - d / 28;
        ctx.globalAlpha = k * fade * .9;
        ctx.beginPath(); ctx.arc(x, y, 1 + k * 1.3, 0, 6.2832); ctx.fill();
      }
    }
    const R = 130;
    if (px > -R && px < w + R && py > -R && py < h + R) {
      const x0 = Math.max(0, Math.floor((px - R - OFF) / STEP)), x1 = Math.ceil((px + R - OFF) / STEP);
      const y0 = Math.max(0, Math.floor((py - R - OFF) / STEP)), y1 = Math.ceil((py + R - OFF) / STEP);
      for (let i = x0; i <= x1; i++) for (let j = y0; j <= y1; j++) {
        const x = OFF + i * STEP, y = OFF + j * STEP, k = 1 - Math.hypot(x - px, y - py) / R;
        if (k <= 0) continue;
        ctx.globalAlpha = k * k * .9;
        ctx.beginPath(); ctx.arc(x, y, 1 + k * 1.4, 0, 6.2832); ctx.fill();
      }
    }
    for (const p of packets) {
      if (p.wait > 0) { p.wait -= dt; if (p.wait <= 0) spawn(p); continue; }
      p.x += p.v * dt;
      if (p.x < -60 || p.x > w + 60) { p.wait = 1 + Math.random() * 4; continue; }
      const dir = Math.sign(p.v);
      for (let s = 0; s < 14; s++) {
        ctx.globalAlpha = .55 * (1 - s / 14);
        ctx.fillRect(p.x - dir * s * 3, p.y - .75, 3, 1.5);
      }
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  document.addEventListener("pointermove", e => {
    const r = gridCanvas.getBoundingClientRect();
    px = e.clientX - r.left; py = e.clientY - r.top;
  });
  document.addEventListener("pointerleave", () => { px = py = -999; });
  document.addEventListener("pointerdown", e => {
    const r = gridCanvas.getBoundingClientRect();
    if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom)
      gridCanvas.ping(e.clientX - r.left, e.clientY - r.top);
  });
  if (!reduced) requestAnimationFrame(frame);
})();

/* Printing from the browser: drop the motion layer and use plain text for the name. */
window.addEventListener("beforeprint", () => {
  if (fx) { fx.revert(); fx = null; }
  pinned = null; trace(null);
  const n = document.querySelector(".name");
  if (n) { n.textContent = NAME; n.classList.remove("live"); }
});
window.addEventListener("afterprint", () => render(lang, "swap"));

const fromHash = () => (location.hash === "#es" ? "es" : "en");
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  try { history.replaceState(null, "", "#" + b.dataset.lang); } catch (e) { /* hash is optional */ }
  render(b.dataset.lang, "swap");
}));
window.addEventListener("hashchange", () => { if (/^#(en|es)$/.test(location.hash)) render(fromHash(), "swap"); });
(function initPalette() {
  let p = (location.search.match(/[?&]palette=(\w+)/) || [])[1];
  if (p === undefined) { try { p = localStorage.getItem("cv-palette") || ""; } catch (e) { p = ""; } }
  applyPalette(p);
})();
setupLenis();
render(fromHash(), "intro");
</script>
